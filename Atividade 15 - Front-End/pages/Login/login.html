<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Game Store</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

    <header>

        <h1>🎮 Game Store</h1>

        <nav>

            <a href="../../index.html">
                Início
            </a>

            <a href="login.html">
                Entrar
            </a>

            <a href="../cadastro/cadastro.html">
                Cadastrar
            </a>

        </nav>

    </header>


    <main>

        <section class="login-container">

            <section class="login-box">

                <h2>Entrar</h2>

                <p>
                    Acesse sua conta para continuar.
                </p>


                <form action="#" method="post">

                    <section class="campo">

                        <label for="email">
                            E-mail
                        </label>

                        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

                    </section>


                    <section class="campo">

                        <label for="senha">
                            Senha
                        </label>

                        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

                    </section>


                    <button type="submit" class="btn-login">
                        Entrar
                    </button>

                </form>




                <section class="links-login">

                    <a href="../cadastro/cadastro.html">
                        Criar uma conta
                    </a>

                    <a href="../esqueci-senha/esqueci-senha.html">
                        Esqueci minha senha
                    </a>

                </section>

            </section>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Game Store - Todos os direitos reservados.
        </p>

    </footer>

</body>

</html>
