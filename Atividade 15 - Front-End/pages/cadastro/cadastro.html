
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Game Store</title>

    <link rel="stylesheet" href="cadastro.css">

</head>

<body>

    <header>

        <h1>🎮 Game Store</h1>

        <nav>

            <a href="../../index.html">
                Início
            </a>

            <a href="../Login/login.html">
                Entrar
            </a>

            <a href="cadastro.html">
                Cadastrar
            </a>

        </nav>

    </header>


    <main>

        <section class="cadastro-container">

            <section class="cadastro-box">

                <h2>Criar sua conta</h2>

                <p>
                    Preencha os dados abaixo para criar sua conta.
                </p>


                <form action="#" method="post">


                    <section class="campo">

                        <label for="nome">
                            Nome completo
                        </label>

                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

                    </section>


                    <section class="campo">

                        <label for="email">
                            E-mail
                        </label>

                        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

                    </section>


                    <section class="campo">

                        <label for="telefone">
                            Telefone
                        </label>

                        <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone">

                    </section>


                    <section class="campo">

                        <label for="senha">
                            Senha
                        </label>

                        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

                    </section>


                    <section class="campo">

                        <label for="confirmar-senha">
                            Confirmar senha
                        </label>

                        <input type="password" id="confirmar-senha" name="confirmar-senha"
                            placeholder="Confirme sua senha" required>

                    </section>


                    <section class="termos">

                        <input type="checkbox" id="termos" name="termos" required>

                        <label for="termos">
                            Aceito os termos de uso.
                        </label>

                    </section>


                    <button type="submit" class="btn-cadastro">
                        Criar conta
                    </button>


                </form>


                <section class="links-cadastro">

                    <p>
                        Já possui uma conta?
                    </p>

                    <a href="../Login/login.html">
                        Entrar
                    </a>

                </section>

            </section>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Game Store - Todos os direitos reservados.
        </p>

    </footer>

</body>

</html>
