
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Esqueci minha senha - Game Store</title>

    <link rel="stylesheet" href="esqueci-senha.css">

</head>

<body>

    <header>

        <h1>🎮 Game Store</h1>

        <nav>

            <a href="../../index.html">
                Início
            </a>

            <a href="../Login/login.html">
                Entrar
            </a>

            <a href="../cadastro/cadastro.html">
                Cadastrar
            </a>

        </nav>

    </header>


    <main>

        <section class="recuperacao-container">

            <section class="recuperacao-box">

                <h2>Esqueci minha senha</h2>

                <p>
                    Digite seu e-mail para receber as instruções
                    para recuperar sua senha.
                </p>


                <form action="#" method="post">

                    <section class="campo">

                        <label for="email">
                            E-mail
                        </label>

                        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

                    </section>


                    <button type="submit" class="btn-recuperar">
                        Recuperar senha
                    </button>

                </form>


                <section class="links-recuperacao">

                    <a href="../Login/login.html">
                        Voltar para o login
                    </a>

                    <a href="../cadastro/cadastro.html">
                        Criar uma conta
                    </a>

                </section>

            </section>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Game Store - Todos os direitos reservados.
        </p>

    </footer>

</body>

</html>
