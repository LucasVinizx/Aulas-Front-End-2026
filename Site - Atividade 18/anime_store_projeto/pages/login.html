<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Store - Entrar</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <h1>Anime Store</h1>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="login.html">Entrar</a></li>
                <li><a href="cadastro.html">Cadastrar</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="form-container">
            <img src="../assets/imagens/gengar.jpg" alt="Imagem ilustrativa de Demon Slayer" class="form-image">
            <div class="form-content">
                <h2>Entrar</h2>
                <p>Entre na sua conta para continuar.</p>
                <form action="../index.html">
                    <label for="email">E-mail</label><input type="email" id="email" name="email" required>
                    <label for="senha">Senha</label><input type="password" id="senha" name="senha" required>
                    <button type="submit" class="botao">Entrar</button>
                </form>
                <div class="links-form">
                    <a href="esqueci-senha.html">Esqueci minha senha</a>
                    <a href="cadastro.html">Não tem cadastro? Cadastre-se</a>
                    <a href="../index.html">Voltar para Home</a>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Anime Store - Todos os direitos reservados.</p>
    </footer>
</body>

</html>
