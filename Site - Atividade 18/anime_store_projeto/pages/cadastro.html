<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Store - Cadastro</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <h1>Anime Store</h1>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="login.html">Entrar</a></li>
                <li><a href="cadastro.html">Cadastrar</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="cadastro-container">
            <h2>Crie sua conta</h2>
            <p>Preencha os dados abaixo para realizar seu cadastro.</p>
            <form action="login.html">
                <div class="campo"><label for="nome">Nome completo</label><input type="text" id="nome" name="nome"
                        required></div>
                <div class="campo"><label for="email">E-mail</label><input type="email" id="email" name="email"
                        required></div>
                <div class="campo"><label for="senha">Senha</label><input type="password" id="senha" name="senha"
                        required></div>
                <div class="campo"><label for="confirmar-senha">Confirmar senha</label><input type="password"
                        id="confirmar-senha" name="confirmar-senha" required></div>
                <div class="campo"><label for="rg">RG</label><input type="text" id="rg" name="rg" required></div>
                <div class="campo"><label for="cpf">CPF</label><input type="text" id="cpf" name="cpf" required></div>
                <div class="campo"><label for="endereco">Endereço</label><input type="text" id="endereco"
                        name="endereco" required></div>
                <div class="campo"><label for="cep">CEP</label><input type="text" id="cep" name="cep" required></div>
                <div class="campo"><label for="cidade">Cidade</label><input type="text" id="cidade" name="cidade"
                        required></div>
                <div class="campo"><label for="estado">Estado</label><input type="text" id="estado" name="estado"
                        required></div>
                <div class="campo"><label for="pais">País</label><input type="text" id="pais" name="pais" required>
                </div>
                <div class="campo"><label for="nascimento">Data de nascimento</label><input type="date" id="nascimento"
                        name="nascimento" required></div>
                <button type="submit" class="botao">Cadastrar</button>
            </form>
            <a href="login.html" class="link-voltar">Voltar para o Login</a>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Anime Store - Todos os direitos reservados.</p>
    </footer>
</body>

</html>
