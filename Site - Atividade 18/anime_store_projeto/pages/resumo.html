<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Store - Resumo da Compra</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <h1>Anime Store</h1>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="login.html">Entrar</a></li>
                <li><a href="cadastro.html">Cadastrar</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="resumo-container">
            <h2>Resumo da compra</h2>
            <article class="resumo-produto">
                <img src="../assets/Compra.png" alt="Produto Demon Slayer">
                <div>
                    <h3>Demon Slayer</h3>
                    <p>Produto inspirado no universo de Demon Slayer.</p>
                    <p><strong>Preço: R$ 59,90</strong></p>
                    <label for="quantidade">Quantidade:</label>
                    <input type="number" id="quantidade" name="quantidade" value="1" min="1">
                    <p class="total"><strong>Total: R$ 59,90</strong></p>
                </div>
            </article>
            <div class="acoes-compra">
                <a href="../index.html" class="botao-secundario">Continuar comprando</a>
                <a href="finalizacao.html" class="botao">Finalizar Compra</a>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Anime Store - Todos os direitos reservados.</p>
    </footer>
</body>

</html>
