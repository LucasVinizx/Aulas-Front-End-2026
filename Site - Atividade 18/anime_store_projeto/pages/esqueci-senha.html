<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Store - Recuperar Senha</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <h1>Anime Store</h1>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="login.html">Entrar</a></li>
                <li><a href="cadastro.html">Cadastrar</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="form-container">
            <img src="../assets/imagens/pokemon.jpeg" alt="Imagem ilustrativa de Hellsing" class="form-image">
            <div class="form-content">
                <h2>Recuperar senha</h2>
                <p>Digite seu e-mail para receber as instruções de recuperação da senha.</p>
                <form action="login.html">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                    <button type="submit" class="botao">Recuperar senha</button>
                </form>
                <div class="links-form"><a href="login.html">Voltar para o Login</a></div>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Anime Store - Todos os direitos reservados.</p>
    </footer>
</body>

</html>
